version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: logistics_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - logistics_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logistics_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/delivery_optimization
      - JWT_SECRET=production_super_secret_key_123
      - JWT_EXPIRE=7d
      - PORT=5000
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - mongodb
      - ml-service
    networks:
      - logistics_network
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: logistics_ml
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/delivery_optimization
    depends_on:
      - mongodb
    networks:
      - logistics_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logistics_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - logistics_network
    restart: unless-stopped

networks:
  logistics_network:
    driver: bridge

volumes:
  mongodb_data:
